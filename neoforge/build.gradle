plugins { id 'net.neoforged.moddev' }

// Run the packaged mod so its shaded libraries use the same classloader as in production.
// Quack is a game library, while the unshaded MineTogether libraries are ordinary Java libraries.
sourceSets { launch }

neoForge {
    version = rootProject.neoforge_version
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))
    addModdingDependenciesTo(sourceSets.launch)
    runs {
        configureEach { sourceSet = sourceSets.launch }
        client { client() }
        server { server() }
    }
}
dependencies {
    implementation "net.creeperhost.polylib:polylib-neoforge:${rootProject.polylib_version}"
    launchRuntimeOnly "net.creeperhost.polylib:polylib-neoforge:${rootProject.polylib_version}"
    launchRuntimeOnly files(tasks.named('shadowJar'))
}
processResources { exclude 'minetogetherpartners.accesswidener' }
