plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    version = rootProject.mod_version
    group = rootProject.maven_group
    base.archivesName = "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.creeperhost.net/release' }
        maven { url = 'https://maven.creeperhost.net' }
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }
    dependencies {
        implementation 'org.apache.httpcomponents:httpclient:4.5.14'
        implementation "blue.endless:jankson:${rootProject.jankson_version}"
        implementation("net.creeperhost:MineTogetherLib:${rootProject.mtlib_version}") {
            exclude group: 'net.creeperhost', module: 'MineTogetherSessions'
        }
        implementation("net.creeperhost:MineTogetherSessions:${rootProject.mtsession_version}") {
            transitive = false
        }
    }
    processResources {
        exclude 'assets/minetogetherpartners/atlases/gui.json'
        eachFile {
            if (path.startsWith('assets/minetogetherpartners/textures/gui/')) {
                path = path.replace('textures/gui/', 'textures/gui/sprites/')
            }
        }
        def properties = [version: project.version, minecraft_version: rootProject.minecraft_version,
                          fabric_loader_version: rootProject.fabric_loader_version,
                          neoforge_version: rootProject.neoforge_version,
                          polylib_mod_version: rootProject.polylib_mod_version]
        inputs.properties(properties)
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand properties }
    }
}

configure([project(':fabric'), project(':neoforge')]) {
    apply plugin: 'com.gradleup.shadow'
    sourceSets.main.java.srcDir project(':common').file('src/main/java')
    sourceSets.main.resources.srcDir project(':common').file('src/main/resources')
    configurations { shadowLib }
    configurations.implementation.extendsFrom(configurations.shadowLib)
    dependencies {
        shadowLib 'org.apache.httpcomponents:httpclient:4.5.14'
        shadowLib "blue.endless:jankson:${rootProject.jankson_version}"
        shadowLib("net.creeperhost:MineTogetherLib:${rootProject.mtlib_version}") {
            exclude group: 'net.creeperhost', module: 'MineTogetherSessions'
        }
        shadowLib("net.creeperhost:MineTogetherSessions:${rootProject.mtsession_version}") {
            transitive = false
        }
    }
    jar { archiveClassifier = 'dev' }
    shadowJar {
        dependsOn jar
        configurations = [project.configurations.shadowLib]
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        archiveClassifier = ''
        mergeServiceFiles()
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        relocate 'blue.endless', 'net.creeperhost.minetogetherpartners.repack.blue.endless'
        relocate 'net.covers1624', 'net.creeperhost.minetogetherpartners.repack.net.covers1624'
        relocate 'org.pircbotx', 'net.creeperhost.minetogetherpartners.repack.org.pircbotx'
        relocate 'org.apache.http', 'net.creeperhost.minetogetherpartners.repack.org.apache.http'
        relocate 'org.apache.commons.codec', 'net.creeperhost.minetogetherpartners.repack.org.apache.commons.codec'
        relocate 'org.apache.commons.logging', 'net.creeperhost.minetogetherpartners.repack.org.apache.commons.logging'
        relocate 'com.github.scribejava', 'net.creeperhost.minetogetherpartners.com.github.scribejava'
        relocate 'fi.iki.elonen', 'net.creeperhost.minetogetherpartners.fi.iki.elonen'
        relocate 'com.fasterxml.jackson', 'net.creeperhost.minetogetherpartners.com.fasterxml.jackson'
        relocate 'net.creeperhost.minetogether.lib', 'net.creeperhost.minetogetherpartners.repack.minetogether.lib'
        relocate 'net.creeperhost.minetogether.session', 'net.creeperhost.minetogetherpartners.repack.minetogether.session'
    }
    assemble.dependsOn shadowJar
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = "${rootProject.archives_base_name}-${project.name}"
                artifact shadowJar
                artifact sourcesJar
            }
        }
    }
}
